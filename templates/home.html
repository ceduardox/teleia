<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeleIA Bot</title>
  <style>
    :root {
      --bg: #0c111d;
      --panel: rgba(11, 21, 39, 0.82);
      --line: rgba(255, 255, 255, 0.12);
      --text: #ecf3ff;
      --muted: #9aabc8;
      --accent: #f4b942;
      --accent-2: #4fd1c5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(79, 209, 197, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(244, 185, 66, 0.24), transparent 28%),
        linear-gradient(160deg, #08101b 0%, #121f36 55%, #0f1725 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(860px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
    }

    .hero {
      padding: 40px;
      display: grid;
      gap: 18px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #31d17c;
      box-shadow: 0 0 18px rgba(49, 209, 124, 0.8);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 0.95;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 60ch;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 8px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .button {
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 600;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, var(--accent), #ffdf8a);
      color: #1b1b1b;
    }

    .secondary {
      border: 1px solid var(--line);
      color: var(--text);
    }

    .footer {
      border-top: 1px solid var(--line);
      padding: 20px 40px 28px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">
        <span class="dot"></span>
        Servicio activo
      </div>
      <h1>TeleIA está online.</h1>
      <p>El bot de Telegram está corriendo y el panel administrativo está disponible para cambiar el prompt y gestionar imágenes.</p>
      <div class="actions">
        <a class="button primary" href="{{ admin_url }}">Abrir panel admin</a>
        <a class="button secondary" href="https://t.me" target="_blank" rel="noreferrer">Abrir Telegram</a>
      </div>
    </section>
    <section class="footer">
      <span>Imagen activa: {{ "Sí" if active_image else "No" }}</span>
      <span>Ruta del panel: /admin</span>
    </section>
  </main>
</body>
</html>
